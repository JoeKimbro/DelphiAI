name: DB Backup
on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client (pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: backups
          BACKUP_RETENTION_DAYS: "14"
        run: python -m scripts.backup_db
      - name: Encrypt dumps (fail safe — never upload plaintext)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret not set — refusing to upload plaintext DB dumps." >&2
            exit 1
          fi
          shopt -s nullglob
          for f in backups/*.dump; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 "$f"
            rm -f "$f"
          done
      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.dump.gpg
          retention-days: 14
