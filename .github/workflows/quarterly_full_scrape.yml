name: Quarterly Full Fighter Scrape

on:
  schedule:
    # 1st of Jan, Jun, Nov at 6am UTC — full roster refresh every ~5 months
    - cron: "0 6 1 1,6,11 *"
  workflow_dispatch:
    # Manual trigger if you want to force a full scrape outside the schedule

jobs:
  full-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export DB_* vars from DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          import os, urllib.parse
          url = urllib.parse.urlparse(os.environ["DATABASE_URL"])
          lines = [
            f"DB_HOST={url.hostname}",
            f"DB_PORT={url.port or 5432}",
            f"DB_NAME={url.path.lstrip('/')}",
            f"DB_USER={url.username}",
            f"DB_PASSWORD={url.password}",
            f"DATABASE_URL={os.environ['DATABASE_URL']}",
          ]
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print("DB vars exported.")
          EOF

      - name: Apply migrations
        run: yoyo apply --batch --database "$DATABASE_URL" DelphiAIApp/Models/migrations

      - name: Run full weekly update (all ~946 fighters)
        working-directory: DelphiAIApp/Models
        run: python -m ml.weekly_update

      - name: Prefetch predictions for top 4 upcoming events
        working-directory: DelphiAIApp/Models
        run: python -m ml.prefetch_predictions
