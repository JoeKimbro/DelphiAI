name: Weekly Data Update

on:
  schedule:
    # Tuesdays at 6am UTC — UFCStats is ready 24-48h after Saturday events
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip scraping (use existing CSVs)"
        required: false
        default: "false"
        type: boolean
      full_scrape:
        description: "Run full scrape of all ~946 fighters (default: incremental, ~20-30 fighters)"
        required: false
        default: "false"
        type: boolean
      lookback_days:
        description: "Incremental only: scrape fighters active in the last N days (raise to backfill missed events, e.g. 130)"
        required: false
        default: 21
        type: number

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Without the model, predictions fall back to ELO-only. No-op when the
      # MODEL_URL secret is unset; MODEL_SHA256 (optional) pins the digest.
      - name: Fetch model
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
          MODEL_SHA256: ${{ secrets.MODEL_SHA256 }}
        run: python scripts/fetch_model.py

      - name: Export DB_* vars from DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          import os, urllib.parse
          url = urllib.parse.urlparse(os.environ["DATABASE_URL"])
          # The password is derived from the secret, so GitHub won't mask it on its own.
          print(f"::add-mask::{url.password}")
          print(f"::add-mask::{os.environ['DATABASE_URL']}")
          lines = [
            f"DB_HOST={url.hostname}",
            f"DB_PORT={url.port or 5432}",
            f"DB_NAME={url.path.lstrip('/')}",
            f"DB_USER={url.username}",
            f"DB_PASSWORD={url.password}",
            f"DATABASE_URL={os.environ['DATABASE_URL']}",
          ]
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print("DB vars exported.")
          EOF

      - name: Apply migrations
        run: yoyo apply --batch --database "$DATABASE_URL" DelphiAIApp/Models/migrations

      # data/output is the working dataset (ELO and PIT stats are recomputed from
      # fights.csv), so carry it between runs instead of restarting from the
      # committed snapshot each time.
      - name: Restore latest data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=DelphiAIApp/Models/data/output
          IDS=$( { gh run list -R "$GITHUB_REPOSITORY" --workflow weekly_update.yml --status success -L 5 --json databaseId,createdAt -q '.[] | "\(.createdAt) \(.databaseId)"' || true
                   gh run list -R "$GITHUB_REPOSITORY" --workflow quarterly_full_scrape.yml --status success -L 5 --json databaseId,createdAt -q '.[] | "\(.createdAt) \(.databaseId)"' || true; } | sort -r | awk '{print $2}')
          for id in $IDS; do
            rm -rf /tmp/data-output
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n data-output -D /tmp/data-output 2>/dev/null; then
              cp -f /tmp/data-output/* "$OUT"/
              echo "Restored $OUT from run $id"
              exit 0
            fi
          done
          echo "No previous data snapshot found; using committed CSVs"

      - name: Run weekly update
        working-directory: DelphiAIApp/Models
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || 21 }}
        run: |
          if [ "${{ inputs.skip_scrape }}" = "true" ]; then
            python -m ml.weekly_update --skip-scrape
          elif [ "${{ inputs.full_scrape }}" = "true" ]; then
            python -m ml.weekly_update
          else
            python -m ml.weekly_update --incremental --lookback-days "$LOOKBACK_DAYS"
          fi

      - name: Save data snapshot
        uses: actions/upload-artifact@v7
        with:
          name: data-output
          path: |
            DelphiAIApp/Models/data/output/*.csv
            DelphiAIApp/Models/data/output/*.json
          retention-days: 90

      - name: Prefetch predictions for top 4 upcoming events
        working-directory: DelphiAIApp/Models
        run: python -m ml.prefetch_predictions
