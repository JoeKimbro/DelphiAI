name: Resolve Past Event Results

on:
  schedule:
    # Sundays at 10am UTC — resolves Saturday night's results
    - cron: "0 10 * * 0"
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export DB_* vars from DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          import os, urllib.parse
          url = urllib.parse.urlparse(os.environ["DATABASE_URL"])
          lines = [
            f"DB_HOST={url.hostname}",
            f"DB_PORT={url.port or 5432}",
            f"DB_NAME={url.path.lstrip('/')}",
            f"DB_USER={url.username}",
            f"DB_PASSWORD={url.password}",
            f"DATABASE_URL={os.environ['DATABASE_URL']}",
          ]
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print("DB vars exported.")
          EOF

      - name: Resolve past event predictions
        run: python scripts/resolve_past_events.py
