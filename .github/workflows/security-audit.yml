name: Security Audit
on:
  pull_request: {}
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DelphiAIApp/Views
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit
        # PYSEC-2026-160: twisted vuln fixed only in 26.4.0rc2 which conflicts with Scrapy 2.14.2
        # Ignore until Scrapy releases a compatible twisted fix
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-160
